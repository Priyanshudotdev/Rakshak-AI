; extensions.conf — Rakshak AI dialplan.
; The dialplan does SWITCHING only. No incident intelligence here (spec §6):
; every answered call is handed to the ARI application "rakshak", which owns
; bridging, External Media streaming and teardown via services/media-gateway.

[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
; ARI application name — must match the gateway's ARI subscription.
RAKSHAK_ARI_APP = rakshak
; Where ARI sends External Media (RTP) for STT streaming.
; ws:// host must be reachable from the Asterisk container/host.
RAKSHAK_MEDIA_WS = ws://media-gateway:3002/gateway/audio

[rakshak-incoming]
; Provider DID and test extension land here.
exten = _X.,1,NoOp(Rakshak incoming from ${CALLERID(all)} to ${EXTEN})
 same = n,Set(CDR(userfield)=rakshak-v2)
 same = n,Answer()
 ; Hand control to ARI. From here on, the gateway drives:
 ; bridge, external-media fork, TTS injection, hangup.
 same = n,Stasis(${RAKSHAK_ARI_APP},${EXTEN},${CALLERID(num)})
 ; ARI returned (hangup or error) — make sure the channel is gone.
 same = n,Hangup()

; Intercom between the two test phones — direct Dial, bypasses ARI so the
; phones can talk to each other without entering the incident pipeline.
exten = 1001,1,NoOp(Rakshak intercom to 1001)
 same = n,Dial(PJSIP/1001,30)
 same = n,Hangup()
exten = 1002,1,NoOp(Rakshak intercom to 1002)
 same = n,Dial(PJSIP/1002,30)
 same = n,Hangup()

; Echo test: dial 9001 from ONE phone, speak, hear yourself back ~instantly.
; Proves that phone's two-way audio without needing the second phone.
exten = 9001,1,NoOp(Rakshak echo test from ${CALLERID(all)})
 same = n,Answer()
 same = n,Echo()
 same = n,Hangup()

; Operator join: 1001 dials 9002 to enter the newest live emergency bridge.
; Hears the caller + AI, can speak (everyone hears). No live call: hangup.
exten = 9002,1,NoOp(Rakshak operator join from ${CALLERID(all)})
 same = n,Answer()
 same = n,Stasis(${RAKSHAK_ARI_APP},9002,${CALLERID(num)})
 same = n,Hangup()

; Emergency test lines: dial 9000 (either phone) or 1000, speak, hear Marathi
; TTS back. Separate context — Goto-ing back into rakshak-incoming would
; re-match the same literal and loop forever.
exten = 9000,1,Goto(rakshak-emergency,${EXTEN},1)
exten = 1000,1,Goto(rakshak-emergency,${EXTEN},1)

[rakshak-emergency]
; record -> transcribe -> incident-card loop over a real SIP leg.
; (Two-way injection arrives in Phase 4.)
exten = _X.,1,NoOp(Rakshak emergency line ${EXTEN} from ${CALLERID(all)})
 same = n,Set(CDR(userfield)=rakshak-v2)
 same = n,Answer()
 ; Ground-truth recorder: mixed caller audio for debugging STT silence.
 same = n,MixMonitor(rakshak-${UNIQUEID}.wav)
 same = n,Stasis(${RAKSHAK_ARI_APP},${EXTEN},${CALLERID(num)})
 same = n,Hangup()

; Safety net — never leave stray channels dial-toned.
exten = h,1,NoOp(Rakshak hangup cause=${HANGUPCAUSE})
