; ari.conf — ARI access for the Rakshak media gateway.
; Password via deploy-time include (ari.d/10-password.conf, git-ignored).
; The gateway connects to http://asterisk:8088/ari with this user and
; subscribes to the "rakshak" application (see extensions.conf).

[general]
enabled = yes
pretty = yes
allowed_origins = *

[rakshak-gateway]
type = user
read_only = no
; Local test credential. Production: replace via ari.d include (git-ignored).
password = rakshak-ari-test-only
password_format = plain
