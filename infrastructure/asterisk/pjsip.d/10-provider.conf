; 10-provider.conf — VoiceLink inbound trunk (IP-auth, no secrets in repo).
; Their proxy (observed 160.30.71.89:3300, panel: sip.voicelink.co.in:3300)
; sends INVITEs with a clean DID Request-URI. Matched by source IP into
; rakshak-incoming; any extension (incl. the DID) enters the ARI flow.
; Match covers their signaling block; tighten if they publish exact CIDRs.

[voicelink]
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
trust_id_inbound = yes
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no

[voicelink-identify]
type = identify
endpoint = voicelink
match = 160.30.71.0/24
