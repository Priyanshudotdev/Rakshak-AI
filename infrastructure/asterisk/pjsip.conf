; pjsip.conf — Rakshak AI telephony foundation (Asterisk 20+, PJSIP).
; Secrets NEVER live here. Trunk credentials come from environment at deploy
; time (see README). This file defines structure, codecs and timers only.
;
; Verify against https://docs.asterisk.org before production use — option
; names drift between Asterisk releases.

[global]
type = global
user_agent = RakshakAI-telephony
; Keep endpoints reachable behind NAT with frequent qualifies.
; (Per-endpoint qualify_frequency set below.)

; --- Transports -------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; --- SIP trunk (provider DID) ------------------------------------------------
; Auth credentials are injected at deploy time, e.g. via envsubst into
; pjsip.d/10-trunk-auth.conf (git-ignored). The trunk registers OUTBOUND so
; Asterisk sits behind NAT without inbound port exposure where possible.
[trunk-reg]
type = registration
transport = transport-udp
outbound_auth = trunk-auth
server_uri = sip:${SIP_TRUNK_HOST:-sip.provider.example}
client_uri = sip:${SIP_TRUNK_USER:-rakshak}@${SIP_TRUNK_HOST:-sip.provider.example}
retry_interval = 20
max_retries = 20

[trunk-auth]
type = auth
auth_type = userpass
; Values replaced at deploy time — never commit real credentials.
username = ${SIP_TRUNK_USER:-rakshak}
password = ${SIP_TRUNK_PASSWORD:-CHANGE_ME}

[trunk-aor]
type = aor
contact = sip:${SIP_TRUNK_HOST:-sip.provider.example}:5060
qualify_frequency = 60

[trunk-endpoint](!)
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
; 8 kHz narrowband is the telephony reality — the gateway upsamples for STT.
dtmf_mode = rfc4733
direct_media = no
trust_id_inbound = yes
rtp_timeout = 60
rtp_timeout_hold = 300

[trunk](trunk-endpoint)
outbound_auth = trunk-auth
aors = trunk-aor

[trunk-identify]
type = identify
endpoint = trunk
match = ${SIP_TRUNK_HOST:-sip.provider.example}

; --- Local Rakshak media shim (test extension, no provider needed) -----------
; Lets the team exercise ARI + gateway flows without a paid trunk.
[1000]
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
auth = 1000-auth
aors = 1000
direct_media = no

[1000-auth]
type = auth
auth_type = userpass
username = 1000
; Change per deployment; test-only credential.
password = ${TEST_EXT_PASSWORD:-rakshak-test-only}

[1000]
type = aor
max_contacts = 2
qualify_frequency = 30
