; pjsip.conf — Rakshak AI telephony foundation (Asterisk 20+, PJSIP).
; Secrets NEVER live here. Trunk credentials come from environment at deploy
; time (see README). This file defines structure, codecs and timers only.
;
; Verify against https://docs.asterisk.org before production use — option
; names drift between Asterisk releases.

[global]
type = global
user_agent = RakshakAI-telephony
; Keep endpoints reachable behind NAT with frequent qualifies.
; (Per-endpoint qualify_frequency set below.)

; --- Transports -------------------------------------------------------------
; Docker NAT note: phones arrive NAT'd as 172.20.0.1, so a local_net covering
; Docker would classify them "local" and SDP would carry the container IP —
; phones then send all voice into the void (Rx=0 forever, the bug we hit).
; With NO local_net, every peer is external and SDP always carries the host
; address below. A stable mDNS hostname (not a DHCP IP) survives WiFi moves:
; only an Asterisk restart is needed after the network changes, never a
; config edit. (DHCP IPs broke audio silently twice before this.)
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = 192.168.1.39

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; --- SIP trunk (provider DID) ------------------------------------------------
; Lives in pjsip.d/20-trunk.conf (git-ignored, created from
; pjsip.d/20-trunk.conf.example with real credentials at deploy time) so the
; base config loads cleanly without a provider. The trunk registers OUTBOUND
; so Asterisk sits behind NAT without inbound SIP exposure where possible.
;
; Shared endpoint defaults for provider legs (8 kHz narrowband reality):
[trunk-endpoint](!)
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
direct_media = no
trust_id_inbound = yes
rtp_timeout = 60
rtp_timeout_hold = 300

; --- Local softphones (two real phones, no provider needed) -------------------
; Phone 1 = 1001 (caller), phone 2 = 1002. Both register over WiFi/data to
; this box; 1001<->1002 intercom is direct dial, 9000 is the emergency test
; line that answers into the Rakshak ARI flow. Passwords via env at deploy;
; defaults are test-only and must be changed for any exposed host.
[1001]
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
auth = 1001-auth
aors = 1001
direct_media = no
; NAT traversal: Asterisk lives behind Docker NAT, phones behind WiFi NAT.
; Learn the real media path from incoming RTP instead of trusting SDP.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no

[1001-auth]
type = auth
auth_type = userpass
username = 1001
; Local test credential (same WiFi only). Production: inject via pjsip.d include.
password = rakshak-phone-1

[1001]
type = aor
max_contacts = 2
qualify_frequency = 30

[1002]
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
auth = 1002-auth
aors = 1002
direct_media = no
; NAT traversal: Asterisk lives behind Docker NAT, phones behind WiFi NAT.
; Learn the real media path from incoming RTP instead of trusting SDP.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no

[1002-auth]
type = auth
auth_type = userpass
username = 1002
; Local test credential (same WiFi only). Production: inject via pjsip.d include.
password = rakshak-phone-2

[1002]
type = aor
max_contacts = 2
qualify_frequency = 30

; --- Legacy single test extension (kept for ARI loop demos) ------------------
[1000]
type = endpoint
transport = transport-udp
context = rakshak-incoming
disallow = all
allow = ulaw,alaw
auth = 1000-auth
aors = 1000
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no

[1000-auth]
type = auth
auth_type = userpass
username = 1000
; Local test credential (same WiFi only). Production: inject via pjsip.d include.
password = rakshak-test-only

[1000]
type = aor
max_contacts = 2
qualify_frequency = 30
