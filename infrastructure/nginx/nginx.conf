# Edge reverse proxy: TLS termination, routing, WS upgrades, basic rate limits.
# Dashboard (Next.js) -> 3000, API (REST + /api/stream WS) -> 3001,
# media-gateway (WS audio) -> 3002. Upstream names match docker-compose.

upstream dashboard {
  server dashboard:3000;
}

upstream api {
  server api:3001;
}

upstream media_gateway {
  server media-gateway:3002;
}

# API + dashboard are browser-facing; be stricter here than on gateway audio.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dash_zone:10m rate=60r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;

  # --- Operator dashboard -------------------------------------------------
  location / {
    limit_req zone=dash_zone burst=60 nodelay;
    proxy_pass http://dashboard;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- API: REST ----------------------------------------------------------
  location /api/ {
    limit_req zone=api_zone burst=60 nodelay;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }

  # --- API: live event stream (WebSocket, long-lived) ----------------------
  location = /api/stream {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # --- Media gateway: WS audio intake (Asterisk / mic agents) --------------
  location /gateway/ {
    proxy_pass http://media_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    client_max_body_size 25m;
  }
}
