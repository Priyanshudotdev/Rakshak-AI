# deploy-asterisk — push Asterisk configs to the public SIP box and reload.
#
# Trigger: any push to feat/v2-architecture touching asterisk configs, the VPS
# provision script, or this workflow. Manual runs via "Run workflow".
#
# What it does: tars the configs to the box over SSH, runs setup.sh as root
# (idempotent: install-if-missing, sync, VPS IP overrides, restart, verify).
# setup.sh exits non-zero on any failed check, which turns this run red.
#
# Required GitHub Secrets (repo Settings -> Secrets and variables -> Actions):
#   VPS_HOST    Elastic IP, e.g. 52.66.170.226
#   VPS_USER    ubuntu
#   VPS_SSH_KEY contents of the region's rakshak-key.pem (paste whole file)
# Optional (provider trunk; omit until VoiceLink trunk is confirmed):
#   TRUNK_HOST, TRUNK_USER, TRUNK_PASS
name: deploy-asterisk

on:
  push:
    branches: [feat/v2-architecture]
    paths:
      - infrastructure/asterisk/**
      - infrastructure/vps/**
      - .github/workflows/deploy-asterisk.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ship configs to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_HOST" || { echo "::error::VPS_HOST is empty"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::VPS_USER is empty"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error::VPS_SSH_KEY is empty"; exit 1; }

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/vps.key"
          chmod 600 "$HOME/.ssh/vps.key"

          echo "Checking SSH connectivity to $VPS_HOST"
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"; then
            echo "::error::Unable to retrieve the SSH host key from $VPS_HOST:22"
            exit 1
          fi

          tar czf - infrastructure/asterisk infrastructure/vps/setup.sh |
            ssh -i "$HOME/.ssh/vps.key" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              'rm -rf /tmp/rakshak-deploy && mkdir -p /tmp/rakshak-deploy && tar xzf - -C /tmp/rakshak-deploy'

      - name: Provision + verify Asterisk
        uses: appleboy/ssh-action@v0.1.10
        env:
          PUBLIC_IP: ${{ secrets.VPS_HOST }}
          TRUNK_HOST: ${{ secrets.TRUNK_HOST }}
          TRUNK_USER: ${{ secrets.TRUNK_USER }}
          TRUNK_PASS: ${{ secrets.TRUNK_PASS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PUBLIC_IP,TRUNK_HOST,TRUNK_USER,TRUNK_PASS
          script: sudo -E bash /tmp/rakshak-deploy/infrastructure/vps/setup.sh
